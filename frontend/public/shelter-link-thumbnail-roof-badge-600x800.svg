<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="28" fill="url(#bg)"/>

  <!-- Roof badge icon (centered, scaled for vertical layout) -->
  <g transform="translate(300,280) scale(0.75) translate(-640,-360)" filter="url(#shadow)">
    <!-- badge container -->
    <path d="M640 140l220 80v158c0 166-220 268-220 268s-220-102-220-268V220l220-80z" fill="#ffffff" fill-opacity="0.97"/>
    <!-- roof + door -->
    <path d="M528 364l112-84 112 84v128c0 8.8-7.2 16-16 16H544c-8.8 0-16-7.2-16-16V364z" fill="url(#grad)"/>
    <rect x="628" y="410" width="48" height="92" rx="8" fill="#fff"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="300" y="700" font-size="64" font-weight="800" fill="#ffffff">Shelter Link</text>
  </g>
</svg>

